<!doctype html>
<!--
  redfish — page d'atterrissage d'ENTRAÎNEMENT (sensibilisation).
  GARANTIE PRODUIT : aucune valeur saisie n'est jamais lue, stockée ni transmise.
  Les champs n'ont volontairement AUCUN attribut `name` : ils n'existent que pour
  le réalisme visuel. Le <form> poste vers {{submitUrl}}, qui ne lit rien et
  redirige vers la page de sensibilisation. Le beacon signale seulement l'affichage
  de la page vers {{beaconUrl}} ; il n'envoie RIEN de ce que l'utilisateur tape.
  Aucune ressource externe / CDN, aucune police externe, aucun domaine sosie.
-->
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Paiement des frais de livraison</title>
		<style>
			:root {
				color-scheme: light;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: #f4f4f2;
				color: #1c1c1c;
				font-family: Helvetica, Arial, sans-serif;
			}
			header {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 14px 20px;
				background: #ffcc00;
				font-weight: 800;
				font-size: 16px;
				letter-spacing: 0.5px;
			}
			.card {
				max-width: 440px;
				margin: 32px auto;
				padding: 32px;
				background: #ffffff;
				border-radius: 6px;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
			}
			h1 {
				margin: 0 0 4px;
				font-size: 20px;
			}
			.amount {
				margin: 14px 0 18px;
				padding: 12px 16px;
				background: #fff6d6;
				border: 1px solid #ffe27a;
				border-radius: 4px;
				font-size: 15px;
			}
			.amount b {
				font-size: 18px;
			}
			label {
				display: block;
				margin: 14px 0 4px;
				font-size: 13px;
				font-weight: 700;
			}
			input {
				width: 100%;
				padding: 11px 12px;
				border: 1px solid #c3c3c0;
				border-radius: 4px;
				font-size: 15px;
			}
			input:focus {
				outline: none;
				border-color: #1c1c1c;
			}
			.row {
				display: flex;
				gap: 12px;
			}
			.row > div {
				flex: 1;
			}
			button {
				margin-top: 22px;
				width: 100%;
				padding: 13px;
				border: none;
				border-radius: 4px;
				background: #1c1c1c;
				color: #ffcc00;
				font-size: 15px;
				font-weight: 800;
				cursor: pointer;
			}
			.foot {
				margin-top: 20px;
				font-size: 12px;
				color: #6b6b6b;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<header>
			<svg
				width="22"
				height="22"
				viewBox="0 0 24 24"
				xmlns="http://www.w3.org/2000/svg"
				aria-hidden="true"
			>
				<circle cx="12" cy="12" r="11" fill="#1c1c1c" />
				<path
					d="M7 15c0-3 2-5 5-5 2 0 3 1 3 2.5S17 15 16 15"
					fill="none"
					stroke="#ffcc00"
					stroke-width="1.6"
					stroke-linecap="round"
				/>
				<circle cx="8" cy="15.5" r="1.4" fill="#ffcc00" />
			</svg>
			<span>La Poste Suisse</span>
		</header>

		<main class="card">
			<h1>Régler les frais de livraison</h1>
			<div class="amount">
				Bonjour {{firstName}}, montant à régler : <b>CHF&nbsp;2.95</b><br />
				Colis 99.34.1234.0000 7845 21
			</div>

			<!-- Le formulaire poste vers {{submitUrl}} ; aucun champ n'est lu côté serveur. -->
			<form action="{{submitUrl}}" method="post" autocomplete="off" novalidate>
				<label for="card">Numéro de carte</label>
				<input id="card" type="text" inputmode="numeric" placeholder="0000 0000 0000 0000" />

				<div class="row">
					<div>
						<label for="exp">Expiration</label>
						<input id="exp" type="text" inputmode="numeric" placeholder="MM / AA" />
					</div>
					<div>
						<label for="cvc">CVC</label>
						<input id="cvc" type="text" inputmode="numeric" placeholder="123" />
					</div>
				</div>

				<button type="submit">Payer CHF 2.95</button>
			</form>

			<p class="foot">Paiement sécurisé · La Poste Suisse</p>
		</main>

		<script>
			// Beacon d'interaction : signale UNIQUEMENT que la page a été affichée.
			// Il n'accède à aucun champ et n'envoie jamais ce que l'utilisateur saisit.
			(function () {
				try {
					if (navigator.sendBeacon) {
						navigator.sendBeacon('{{beaconUrl}}');
					} else {
						fetch('{{beaconUrl}}', { method: 'POST', keepalive: true });
					}
				} catch (e) {
					/* sans effet : la page reste fonctionnelle */
				}
			})();
		</script>
	</body>
</html>
