<!doctype html>
<!--
  redfish : page d'atterrissage d'ENTRAÎNEMENT (sensibilisation).
  GARANTIE PRODUIT : aucune valeur saisie n'est jamais lue, stockée ni transmise.
  Les champs n'ont volontairement AUCUN attribut `name` : ils n'existent que pour
  le réalisme visuel. Le <form> poste vers {{submitUrl}}, qui ne lit rien et
  redirige vers la page de sensibilisation. Le beacon signale seulement l'affichage
  de la page vers {{beaconUrl}} ; il n'envoie RIEN de ce que l'utilisateur tape.
  Aucune ressource externe / CDN, aucune police externe, aucun domaine sosie.
-->
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Connexion à l'Espace Client</title>
		<style>
			:root {
				color-scheme: light;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: #eef0f2;
				color: #1c1c1c;
				font-family: Arial, Helvetica, sans-serif;
			}
			header {
				padding: 16px 20px;
				background: #00594f;
				color: #ffffff;
				font-weight: 700;
				font-size: 16px;
			}
			.card {
				max-width: 460px;
				margin: 32px auto;
				padding: 32px;
				background: #ffffff;
				border: 1px solid #d7dbe0;
				border-radius: 5px;
			}
			h1 {
				margin: 0 0 4px;
				font-size: 20px;
			}
			.summary {
				margin: 14px 0 18px;
				padding: 14px 16px;
				background: #f1f6f5;
				border: 1px solid #d7dbe0;
				border-radius: 4px;
				font-size: 14px;
			}
			.summary b {
				font-size: 18px;
			}
			label {
				display: block;
				margin: 14px 0 4px;
				font-size: 13px;
				font-weight: 700;
			}
			input {
				width: 100%;
				padding: 11px 12px;
				border: 1px solid #c3c3c0;
				border-radius: 4px;
				font-size: 15px;
			}
			input:focus {
				outline: none;
				border-color: #00594f;
			}
			button {
				margin-top: 22px;
				width: 100%;
				padding: 13px;
				border: none;
				border-radius: 4px;
				background: #00594f;
				color: #ffffff;
				font-size: 15px;
				font-weight: 700;
				cursor: pointer;
			}
			.foot {
				margin-top: 20px;
				font-size: 12px;
				color: #6b6b6b;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<header>Groupe Mutuel | Espace Client</header>

		<main class="card">
			<h1>Connexion à l'Espace Client</h1>
			<div class="summary">
				Bonjour {{firstName}}, remboursement en attente : <b>CHF&nbsp;248.60</b><br />
				Connectez-vous pour consulter votre décompte de prestations.
			</div>

			<!-- Le formulaire poste vers {{submitUrl}} ; aucun champ n'est lu côté serveur. -->
			<form action="{{submitUrl}}" method="post" autocomplete="off" novalidate>
				<label for="insured">Numéro d'assuré</label>
				<input id="insured" type="text" inputmode="numeric" placeholder="Numéro d'assuré" />

				<label for="pwd">Mot de passe</label>
				<input id="pwd" type="password" placeholder="Mot de passe" />

				<button type="submit">Se connecter</button>
			</form>

			<p class="foot">Connexion chiffrée · Espace Client</p>
		</main>

		<script>
			// Beacon d'interaction : signale UNIQUEMENT que la page a été affichée.
			// Il n'accède à aucun champ et n'envoie jamais ce que l'utilisateur saisit.
			(function () {
				try {
					if (navigator.sendBeacon) {
						navigator.sendBeacon('{{beaconUrl}}');
					} else {
						fetch('{{beaconUrl}}', { method: 'POST', keepalive: true });
					}
				} catch (e) {
					/* sans effet : la page reste fonctionnelle */
				}
			})();
		</script>
	</body>
</html>
