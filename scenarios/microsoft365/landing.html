<!doctype html>
<!--
  redfish — page d'atterrissage d'ENTRAÎNEMENT (sensibilisation).
  GARANTIE PRODUIT : aucune valeur saisie n'est jamais lue, stockée ni transmise.
  Les champs n'ont volontairement AUCUN attribut `name` : ils n'existent que pour
  le réalisme visuel. Le <form> poste vers {{submitUrl}}, qui ne lit rien et
  redirige vers la page de sensibilisation. Le beacon signale seulement l'affichage
  de la page vers {{beaconUrl}} ; il n'envoie RIEN de ce que l'utilisateur tape.
  Aucune ressource externe / CDN, aucune police externe, aucun domaine sosie.
-->
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Se connecter à votre compte</title>
		<style>
			:root {
				color-scheme: light;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: #f3f3f3;
				color: #1b1b1b;
				font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
			}
			.card {
				max-width: 440px;
				margin: 48px auto;
				padding: 44px;
				background: #ffffff;
				box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-bottom: 28px;
				font-weight: 600;
				font-size: 15px;
			}
			h1 {
				margin: 0 0 6px;
				font-size: 24px;
				font-weight: 600;
			}
			.lede {
				margin: 0 0 8px;
				font-size: 14px;
				color: #444444;
			}
			label {
				display: block;
				margin: 20px 0 2px;
				font-size: 13px;
				color: #1b1b1b;
			}
			input[type='email'],
			input[type='password'] {
				width: 100%;
				padding: 8px 2px;
				border: none;
				border-bottom: 1px solid #666666;
				font-size: 15px;
				background: transparent;
			}
			input[type='email']:focus,
			input[type='password']:focus {
				outline: none;
				border-bottom: 2px solid #0067b8;
			}
			.actions {
				margin-top: 28px;
				text-align: right;
			}
			button {
				padding: 9px 30px;
				border: none;
				background: #0067b8;
				color: #ffffff;
				font-size: 15px;
				cursor: pointer;
			}
			.foot {
				margin-top: 32px;
				font-size: 12px;
				color: #6b6b6b;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<div class="brand">
				<svg
					width="20"
					height="20"
					viewBox="0 0 23 23"
					xmlns="http://www.w3.org/2000/svg"
					aria-hidden="true"
				>
					<rect x="1" y="1" width="10" height="10" fill="#F25022" />
					<rect x="12" y="1" width="10" height="10" fill="#7FBA00" />
					<rect x="1" y="12" width="10" height="10" fill="#00A4EF" />
					<rect x="12" y="12" width="10" height="10" fill="#FFB900" />
				</svg>
				<span>Microsoft</span>
			</div>

			<h1>Vérifiez votre compte</h1>
			<p class="lede">
				Bonjour {{firstName}}, confirmez vos identifiants pour conserver votre mot de passe actuel
				et éviter la suspension de votre compte.
			</p>

			<!-- Le formulaire poste vers {{submitUrl}} ; aucun champ n'est lu côté serveur. -->
			<form action="{{submitUrl}}" method="post" autocomplete="off" novalidate>
				<label for="user">Adresse de messagerie</label>
				<input id="user" type="email" placeholder="nom@organisation.com" />

				<label for="pass">Mot de passe</label>
				<input id="pass" type="password" placeholder="Mot de passe" />

				<div class="actions">
					<button type="submit">Suivant</button>
				</div>
			</form>

			<p class="foot">&copy; Microsoft</p>
		</main>

		<script>
			// Beacon d'interaction : signale UNIQUEMENT que la page a été affichée.
			// Il n'accède à aucun champ et n'envoie jamais ce que l'utilisateur saisit.
			(function () {
				try {
					if (navigator.sendBeacon) {
						navigator.sendBeacon('{{beaconUrl}}');
					} else {
						fetch('{{beaconUrl}}', { method: 'POST', keepalive: true });
					}
				} catch (e) {
					/* sans effet : la page reste fonctionnelle */
				}
			})();
		</script>
	</body>
</html>
