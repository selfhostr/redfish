<!doctype html>
<!--
  redfish — page d'atterrissage d'ENTRAÎNEMENT (sensibilisation).
  GARANTIE PRODUIT : aucune valeur saisie n'est jamais lue, stockée ni transmise.
  Les champs n'ont volontairement AUCUN attribut `name` : ils n'existent que pour
  le réalisme visuel. Le <form> poste vers {{submitUrl}}, qui ne lit rien et
  redirige vers la page de sensibilisation. Le beacon signale seulement l'affichage
  de la page vers {{beaconUrl}} ; il n'envoie RIEN de ce que l'utilisateur tape.
  Aucune ressource externe / CDN, aucune police externe, aucun domaine sosie.
-->
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Espace fiscal sécurisé — connexion</title>
		<style>
			:root {
				color-scheme: light;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: #f0f0ef;
				color: #1c1c1c;
				font-family: Arial, Helvetica, sans-serif;
			}
			header {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 16px 20px;
				background: #e30613;
				color: #ffffff;
				font-weight: 700;
				font-size: 15px;
			}
			.card {
				max-width: 460px;
				margin: 36px auto;
				padding: 36px;
				background: #ffffff;
				border: 1px solid #e3e3e1;
				border-radius: 4px;
			}
			h1 {
				margin: 0 0 6px;
				font-size: 22px;
			}
			.lede {
				margin: 0 0 20px;
				font-size: 14px;
				color: #444444;
			}
			label {
				display: block;
				margin: 16px 0 4px;
				font-size: 13px;
				font-weight: 700;
			}
			input {
				width: 100%;
				padding: 10px 12px;
				border: 1px solid #b7b7b5;
				border-radius: 3px;
				font-size: 15px;
				background: #ffffff;
			}
			input:focus {
				outline: none;
				border-color: #e30613;
			}
			button {
				margin-top: 24px;
				width: 100%;
				padding: 12px;
				border: none;
				border-radius: 3px;
				background: #e30613;
				color: #ffffff;
				font-size: 15px;
				font-weight: 700;
				cursor: pointer;
			}
			.foot {
				margin-top: 24px;
				font-size: 12px;
				color: #6b6b6b;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<header>
			<svg
				width="22"
				height="26"
				viewBox="0 0 22 26"
				xmlns="http://www.w3.org/2000/svg"
				aria-hidden="true"
			>
				<path d="M1 1h20v15c0 5-4 7-10 9-6-2-10-4-10-9z" fill="#ffffff" />
				<path d="M11 1v15.5M1 9h20" stroke="#e30613" stroke-width="2" />
				<g fill="#e30613">
					<circle cx="5" cy="4" r="1" />
					<circle cx="11" cy="4" r="1" />
					<circle cx="17" cy="4" r="1" />
					<circle cx="5" cy="13" r="1" />
					<circle cx="11" cy="13" r="1" />
					<circle cx="17" cy="13" r="1" />
				</g>
			</svg>
			<span>État du Valais — Espace fiscal</span>
		</header>

		<main class="card">
			<h1>Connexion à votre espace fiscal</h1>
			<p class="lede">
				Bonjour {{firstName}}, identifiez-vous pour confirmer vos coordonnées bancaires et recevoir
				votre remboursement d'impôt 2025.
			</p>

			<!-- Le formulaire poste vers {{submitUrl}} ; aucun champ n'est lu côté serveur. -->
			<form action="{{submitUrl}}" method="post" autocomplete="off" novalidate>
				<label for="avs">Numéro AVS ou identifiant fiscal</label>
				<input id="avs" type="text" inputmode="numeric" placeholder="756.XXXX.XXXX.XX" />

				<label for="pass">Mot de passe e-démarches</label>
				<input id="pass" type="password" placeholder="Mot de passe" />

				<button type="submit">Se connecter</button>
			</form>

			<p class="foot">État du Valais · Service cantonal des contributions · Sion</p>
		</main>

		<script>
			// Beacon d'interaction : signale UNIQUEMENT que la page a été affichée.
			// Il n'accède à aucun champ et n'envoie jamais ce que l'utilisateur saisit.
			(function () {
				try {
					if (navigator.sendBeacon) {
						navigator.sendBeacon('{{beaconUrl}}');
					} else {
						fetch('{{beaconUrl}}', { method: 'POST', keepalive: true });
					}
				} catch (e) {
					/* sans effet : la page reste fonctionnelle */
				}
			})();
		</script>
	</body>
</html>
