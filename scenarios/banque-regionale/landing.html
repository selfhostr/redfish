<!doctype html>
<!--
  redfish — page d'atterrissage d'ENTRAÎNEMENT (sensibilisation).
  GARANTIE PRODUIT : aucune valeur saisie n'est jamais lue, stockée ni transmise.
  Les champs n'ont volontairement AUCUN attribut `name` : ils n'existent que pour
  le réalisme visuel. Le <form> poste vers {{submitUrl}}, qui ne lit rien et
  redirige vers la page de sensibilisation. Le beacon signale seulement l'affichage
  de la page vers {{beaconUrl}} ; il n'envoie RIEN de ce que l'utilisateur tape.
  Aucune ressource externe / CDN, aucune police externe, aucun domaine sosie.
-->
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>e-banking — connexion sécurisée</title>
		<style>
			:root {
				color-scheme: light;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: #eef1ef;
				color: #1c2b27;
				font-family: Arial, Helvetica, sans-serif;
			}
			header {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 16px 20px;
				background: #0d4a3a;
				color: #ffffff;
				font-family: Georgia, 'Times New Roman', serif;
				font-weight: 700;
				font-size: 16px;
			}
			.card {
				max-width: 440px;
				margin: 36px auto;
				padding: 36px;
				background: #ffffff;
				border: 1px solid #dfe4e1;
				border-radius: 4px;
			}
			h1 {
				margin: 0 0 6px;
				font-size: 21px;
				font-family: Georgia, 'Times New Roman', serif;
			}
			.lede {
				margin: 0 0 20px;
				font-size: 14px;
				color: #44544f;
			}
			label {
				display: block;
				margin: 16px 0 4px;
				font-size: 13px;
				font-weight: 700;
			}
			input {
				width: 100%;
				padding: 10px 12px;
				border: 1px solid #b9c2bd;
				border-radius: 3px;
				font-size: 15px;
			}
			input:focus {
				outline: none;
				border-color: #0d4a3a;
			}
			button {
				margin-top: 24px;
				width: 100%;
				padding: 12px;
				border: none;
				border-radius: 3px;
				background: #0d4a3a;
				color: #ffffff;
				font-size: 15px;
				font-weight: 700;
				cursor: pointer;
			}
			.secure {
				display: flex;
				align-items: center;
				gap: 6px;
				margin-top: 18px;
				font-size: 12px;
				color: #44544f;
			}
			.foot {
				margin-top: 10px;
				font-size: 12px;
				color: #6b6b6b;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<header>
			<svg
				width="20"
				height="24"
				viewBox="0 0 22 26"
				xmlns="http://www.w3.org/2000/svg"
				aria-hidden="true"
			>
				<path d="M11 1l9 3v8c0 6-4 10-9 13-5-3-9-7-9-13V4z" fill="#ffffff" />
				<rect x="7.5" y="11" width="7" height="6" rx="1" fill="#0d4a3a" />
				<path d="M8.5 11v-2a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="#0d4a3a" stroke-width="1.4" />
			</svg>
			<span>Banque Cantonale du Valais</span>
		</header>

		<main class="card">
			<h1>Revalidation de votre accès e-banking</h1>
			<p class="lede">
				Bonjour {{firstName}}, connectez-vous pour lever la restriction appliquée à votre contrat et
				confirmer que vous êtes bien à l'origine de l'activité détectée.
			</p>

			<!-- Le formulaire poste vers {{submitUrl}} ; aucun champ n'est lu côté serveur. -->
			<form action="{{submitUrl}}" method="post" autocomplete="off" novalidate>
				<label for="contract">Numéro de contrat</label>
				<input id="contract" type="text" inputmode="numeric" placeholder="Numéro de contrat" />

				<label for="pass">Mot de passe e-banking</label>
				<input id="pass" type="password" placeholder="Mot de passe" />

				<label for="otp">Code de sécurité (application / mTAN)</label>
				<input id="otp" type="text" inputmode="numeric" placeholder="Code à usage unique" />

				<button type="submit">Se connecter</button>
			</form>

			<div class="secure">
				<svg
					width="14"
					height="16"
					viewBox="0 0 14 16"
					xmlns="http://www.w3.org/2000/svg"
					aria-hidden="true"
				>
					<rect x="2" y="7" width="10" height="7" rx="1" fill="#0d4a3a" />
					<path d="M4 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="#0d4a3a" stroke-width="1.4" />
				</svg>
				<span>Connexion chiffrée</span>
			</div>
			<p class="foot">Banque Cantonale du Valais · e-banking</p>
		</main>

		<script>
			// Beacon d'interaction : signale UNIQUEMENT que la page a été affichée.
			// Il n'accède à aucun champ et n'envoie jamais ce que l'utilisateur saisit.
			(function () {
				try {
					if (navigator.sendBeacon) {
						navigator.sendBeacon('{{beaconUrl}}');
					} else {
						fetch('{{beaconUrl}}', { method: 'POST', keepalive: true });
					}
				} catch (e) {
					/* sans effet : la page reste fonctionnelle */
				}
			})();
		</script>
	</body>
</html>
