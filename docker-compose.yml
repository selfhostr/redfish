# Développement et tests. Production : docker build --target runtime -t redfish .
services:
  app:
    build:
      context: .
      target: dev
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data

  worker:
    build:
      context: .
      target: dev
    env_file: .env
    command: ['npm', 'run', 'worker']
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data

  # Production (image `runtime`, sans volume de code) :
  #   docker compose --profile prod up -d web worker-prod
  # `web` applique les migrations au démarrage ; le worker attend qu'il soit sain.
  web:
    image: redfish
    profiles: ['prod']
    build:
      context: .
      target: runtime
    env_file: .env
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data

  worker-prod:
    image: redfish
    profiles: ['prod']
    env_file: .env
    command: ['node', 'build/worker.js']
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # Sauvegarde continue de data/redfish.db (WAL) vers un stockage S3.
  # Démarrage : docker compose --profile backup up -d litestream
  litestream:
    image: litestream/litestream:0.3.13
    profiles: ['backup']
    env_file: .env
    command: ['replicate', '-config', '/etc/litestream.yml']
    volumes:
      - ./litestream.yml:/etc/litestream.yml:ro
      - ./data:/app/data
