# Production : image publiée (ghcr.io/selfhostr/redfish), signée avec cosign.
#   docker compose up -d
# Construire l'image localement : docker compose up -d --build
# Version précise : REDFISH_IMAGE=ghcr.io/selfhostr/redfish:1.2.3 docker compose up -d
# Développement : docker compose -f docker-compose.dev.yml up -d
# `web` applique les migrations au démarrage ; le worker attend qu'il soit sain.
services:
  web:
    image: ${REDFISH_IMAGE:-ghcr.io/selfhostr/redfish:latest}
    build:
      context: .
      target: runtime
    env_file: .env
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data

  worker:
    image: ${REDFISH_IMAGE:-ghcr.io/selfhostr/redfish:latest}
    env_file: .env
    command: ['node', 'build/worker.js']
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # Sauvegarde continue de data/redfish.db (WAL) vers un stockage S3.
  # Démarrage : docker compose --profile backup up -d litestream
  litestream:
    image: litestream/litestream:0.3.13
    profiles: ['backup']
    env_file: .env
    command: ['replicate', '-config', '/etc/litestream.yml']
    volumes:
      - ./litestream.yml:/etc/litestream.yml:ro
      - ./data:/app/data
