# Production : image publiée (ghcr.io/selfhostr/redfish), signée avec cosign.
#   docker compose up -d
# Construire l'image localement : docker compose up -d --build
# Version précise : REDFISH_IMAGE=ghcr.io/selfhostr/redfish:1.2.3 docker compose up -d
# Développement : docker compose -f docker-compose.dev.yml up -d
# `web` applique les migrations au démarrage ; le worker attend qu'il soit sain.
services:
  web:
    image: ${REDFISH_IMAGE:-ghcr.io/selfhostr/redfish:latest}
    build:
      context: .
      target: runtime
    env_file: .env
    restart: unless-stopped
    # Publié uniquement sur la boucle locale : en production, l'accès passe par un
    # reverse proxy TLS (Caddy, nginx…) sur le même hôte. On évite ainsi d'exposer
    # le tableau de bord en HTTP clair sur l'IP publique (contournement du TLS).
    # Proxy sur une autre machine : remplacer par '0.0.0.0:3000:3000' et filtrer au pare-feu.
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data:/app/data

  worker:
    image: ${REDFISH_IMAGE:-ghcr.io/selfhostr/redfish:latest}
    env_file: .env
    command: ['node', 'build/worker.js']
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # Sauvegarde continue de data/redfish.db (WAL) vers un stockage S3.
  # Démarrage : docker compose --profile backup up -d litestream
  litestream:
    image: litestream/litestream:0.3.13
    profiles: ['backup']
    env_file: .env
    command: ['replicate', '-config', '/etc/litestream.yml']
    volumes:
      - ./litestream.yml:/etc/litestream.yml:ro
      - ./data:/app/data

  # Serveur d'envoi optionnel (OpenSMTPD, soumission authentifiée uniquement, DKIM).
  # Jamais publié sur l'hôte : joignable seulement par `web` et `worker` (hôte « mail », port 587).
  # Démarrage : docker compose --profile mail up -d   (voir docs/self-hosted-sending.md)
  mail:
    image: ${REDFISH_MAIL_IMAGE:-ghcr.io/selfhostr/redfish-mail:latest}
    build: ./mail
    profiles: ['mail']
    # Only the mail variables: the container must not receive the other secrets of .env.
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN:-}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME:-}
      - MAIL_DKIM_SELECTOR=${MAIL_DKIM_SELECTOR:-}
      - MAIL_SMTP_USER=${MAIL_SMTP_USER:-}
      - MAIL_SMTP_PASSWORD=${MAIL_SMTP_PASSWORD:-}
    restart: unless-stopped
    volumes:
      - ./data/mail:/var/lib/redfish-mail
      - ./data/mail/spool:/var/spool/smtpd
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/587']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
