# Développement et tests (serveur vite, code monté) :
#   docker compose -f docker-compose.dev.yml up -d
# Production : voir docker-compose.yml.
services:
  app:
    build:
      context: .
      target: dev
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data

  worker:
    build:
      context: .
      target: dev
    env_file: .env
    command: ['npm', 'run', 'worker']
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data
