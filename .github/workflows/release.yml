name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build, SBOM and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the runtime image
        run: docker build --target runtime -t redfish:${{ github.ref_name }} .

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: redfish:${{ github.ref_name }}
          format: spdx-json
          output-file: redfish-${{ github.ref_name }}.sbom.spdx.json

      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: redfish-${{ github.ref_name }}.sbom.spdx.json

      # Deferred: publish the image to a registry and sign the image and the SBOM
      # with cosign (keyless, id-token: write). Added once the registry and the
      # signing policy are in place.
